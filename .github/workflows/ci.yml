name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: illuminize_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint --filter=@illuminize/api --filter=@illuminize/shared --filter=@illuminize/web

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: API tests (Postgres + Redis services)
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/illuminize_test
          REDIS_URL: redis://localhost:6379/1
          # The BullMQ and Socket.IO adapter tests need this real Redis; fail instead of skipping if it is missing.
          REQUIRE_REAL_REDIS: "1"
        run: pnpm test

      - name: Build API and web
        run: pnpm turbo build --filter=@illuminize/api --filter=@illuminize/web
