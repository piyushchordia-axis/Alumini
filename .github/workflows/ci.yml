name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: illuminize_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Its native binary comes from a platform package (no install script), so a missing one fails here, not in a test.
      - name: Image processing (sharp) loads
        working-directory: apps/api
        run: node -e "import('sharp').then(({ default: s }) => console.log('sharp', s.versions.sharp, 'libvips', s.versions.vips))"

      - name: Lint
        run: pnpm turbo lint --filter=@illuminize/api --filter=@illuminize/shared --filter=@illuminize/web

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: API tests (Postgres + Redis services)
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/illuminize_test
          REDIS_URL: redis://localhost:6379/1
          # The BullMQ and Socket.IO adapter tests need this real Redis; fail instead of skipping if it is missing.
          REQUIRE_REAL_REDIS: "1"
          # Likewise for the database: integration tests fail instead of skipping when it is unreachable.
          REQUIRE_DB: "1"
        run: pnpm test

      - name: Build API and web
        run: pnpm turbo build --filter=@illuminize/api --filter=@illuminize/web

  docker:
    name: API image builds and loads sharp (Alpine, musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The image installs with --ignore-scripts on musl, so sharp's musl binary must come from the lockfile alone.
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t illuminize-api .

      - name: Process an image inside it
        run: >-
          docker run --rm illuminize-api node -e "import('sharp').then(async ({ default: s }) => {
          const png = await s({ create: { width: 8, height: 8, channels: 3, background: '#336699' } }).png().toBuffer();
          const out = await s(png).resize(4, 4).jpeg().toBuffer();
          console.log('sharp', s.versions.sharp, 'libvips', s.versions.vips, (await s(out).metadata()).format);
          })"
