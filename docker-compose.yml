# Local Postgres and Redis for development: `node scripts/setup-local.mjs` starts them (or `docker compose up -d`).
# If 5432 or 6379 is taken on your machine (for example by a native PostgreSQL service on Windows), pick other host
# ports with POSTGRES_PORT / REDIS_PORT; the setup script writes the matching URLs into apps/api/.env.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: illuminize
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional S3-compatible storage for trying STORAGE_PROVIDER=s3 locally:
  #   docker compose --profile s3 up -d     (console at http://localhost:9001, minioadmin / minioadmin)
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the "illuminize" bucket with public read access (images are served straight from it).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/illuminize && mc anonymous set download local/illuminize

volumes:
  pgdata:
  redisdata:
  miniodata:
